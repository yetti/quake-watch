# This workflow will build and deploy the application to GitHub Pages

name: Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: "read"
  pages: "write"
  id-token: "write"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npx ng build --base-href=/quake-watch/
      - name: Add .nojekyll
        run: touch dist/quake-watch/browser/.nojekyll
      - name: Upload pages to artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/quake-watch/browser
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy pages
        id: deployment
        uses: actions/deploy-pages@v5
