<div class="min-h-full">
  <p-menubar class="my-2">
    <ng-template #start>
      <div class="flex flex-row gap-4 items-center">
        <svg data-p-icon="globe" [size]="49" color="var(--p-indigo-500)" class="flex-none"></svg>
        <h1 class="text-3xl font-bold flex-1">{{ title }}</h1>
      </div>
    </ng-template>
  </p-menubar>
  <div class="flex justify-evenly gap-2">
    <p-panel header="Magnitude size" class="flex-1">
      <p-select
        ariaLabel="Magnitude size"
        [options]="magnitudeOptions"
        optionLabel="label"
        placeholder="All magnitudes"
        [showClear]="true"
        (onChange)="magnitudeLimit.set($event.value)"
      />
    </p-panel>
    <p-panel header="Hours in the past" class="flex-1">
      <p-select
        ariaLabel="Hours in the past"
        [options]="hourOptions"
        optionLabel="label"
        placeholder="All time"
        [showClear]="true"
        (onChange)="hourLimit.set($event.value)"
      />
    </p-panel>
  </div>
  <div class="flex justify-center my-2">map</div>
  <div class="flex justify-center my-2" app-quake-list [quakes]="quakes()"></div>
</div>
