<div class="min-h-full">
  <p-menubar class="my-2">
    <ng-template #start>
      <div class="flex flex-row gap-4 items-center">
        <svg data-p-icon="globe" [size]="49" color="var(--p-indigo-500)" class="flex-none"></svg>
        <h1 class="text-3xl font-bold flex-1">{{ title }}</h1>
      </div>
    </ng-template>
  </p-menubar>
  <div class="flex justify-between gap-2">
    <p-panel header="Magnitude size" class="grow">magnitude picker</p-panel>
    <p-panel header="Hours in the past" class="grow">hours picker</p-panel>
  </div>
  <div class="flex justify-center my-2">map</div>
  <div class="flex justify-center my-2" app-quake-list></div>
</div>
